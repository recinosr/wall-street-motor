name: Universo completo y catálogo
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: universo-calculo
  queue: max
  cancel-in-progress: false
jobs:
  universo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_universo.py
      - run: python -m lab.universo
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      - run: python -m lab.etfs --salida resultados/etfs.json
      - name: Publicar solo métricas
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/universo.json resultados/etfs.json resultados/en_que_etfs.json
          git diff --cached --quiet && exit 0
          git commit -m "universo $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin main
