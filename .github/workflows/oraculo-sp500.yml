name: Escaneo diario S&P 500 top 20
on:
  schedule:
    - cron: '15 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oraculo-sp500
  queue: max
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lab.oraculo_scan
      - name: Publicar ranking diario de 20 señales
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/escaner_sp500.json datos/oraculo/escaner/
          git diff --cached --quiet && exit 0
          git commit -m "escaner S&P 500 top20 $GITHUB_RUN_ID"
          bash scripts/push_results.sh
