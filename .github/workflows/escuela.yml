name: escuela
on:
  schedule:
    - cron: '5 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motor-main
  cancel-in-progress: false
jobs:
  escuela:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Velas BTC y ETH del propio proyecto
        run: |
          git fetch --depth=1 origin datos:refs/remotes/origin/datos
          git worktree add --detach /tmp/motor-datos origin/datos
          ln -s /tmp/motor-datos/velas velas
      - run: python -m unittest discover -s tests -p 'test_escuela.py'
      - name: Practicar 1,000 sesiones por bot
        run: python -m scripts.motor escuela --sesiones 1000
      - name: Publicar resumen compacto
        run: |
          git config user.name motor-bot
          git config user.email motor-bot
          git add resultados/escuela.json
          git diff --cached --quiet && exit 0
          git commit -m "escuela $(date -u +%FT%H)"
          git pull --rebase origin main
          git push origin main
