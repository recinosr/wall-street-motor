name: Fabrica diaria BTC ETH
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: motor-fabrica-cripto
  cancel-in-progress: false
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_fabrica_diaria.py
      - run: python -m lab.fabrica_diaria
      - name: Publicar solo métricas
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/fabrica_diaria.json
          git diff --cached --quiet && exit 0
          git commit -m "fabrica diaria $(date -u +%F)"
          bash scripts/push_results.sh
