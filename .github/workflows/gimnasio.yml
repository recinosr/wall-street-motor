name: gimnasio
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motor-gimnasio
  cancel-in-progress: false
jobs:
  gimnasio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        activo: [BTC, ETH]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Velas del propio proyecto
        run: |
          git fetch --depth=1 origin datos:refs/remotes/origin/datos
          git worktree add --detach /tmp/motor-datos origin/datos
          ln -s /tmp/motor-datos/velas velas
      - run: python -m unittest discover -s tests -p 'test_gimnasio.py'
      - name: Entrenar y probar el mes actual, costo 0.1 por ciento por lado
        run: python -m scripts.motor gimnasio --activo "$ACTIVO"
        env:
          ACTIVO: ${{ matrix.activo }}
      - name: Publicar resumen compacto
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add "resultados/gimnasio_${ACTIVO}.json"
          git diff --cached --quiet && exit 0
          git commit -m "gimnasio ${ACTIVO} $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
        env:
          ACTIVO: ${{ matrix.activo }}
