name: vigilante
# Motor sin parar. Los cron de GitHub se retrasan o se descartan cuando son frecuentes
# (3 corridas de la demo en 30 h). Este job vive ~5 h 50 min, despacha cada flujo a su hora
# con workflow_dispatch (que no se descarta) y, antes de terminar, se despacha a sí mismo.
# El cron cada 3 h solo es red de seguridad por si la cadena se corta.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 */3 * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Despachar flujos a su hora
        run: |
          set -u
          inicio=$(date +%s)
          limite=$((inicio + 350*60))
          ultimo=""
          lanzar() {
            if gh workflow run "$1" --ref main >/dev/null 2>&1; then
              echo "$(date -u +%FT%TZ) ✓ $1"
            else
              echo "$(date -u +%FT%TZ) ✗ $1 (reintento en el próximo minuto)"
              return 1
            fi
          }
          while [ "$(date +%s)" -lt "$limite" ]; do
            clave=$(date -u +%Y%m%d%H%M)
            if [ "$clave" != "$ultimo" ]; then
              ultimo=$clave
              m=$((10#$(date -u +%M))); h=$((10#$(date -u +%H))); dow=$(date -u +%u); dom=$((10#$(date -u +%d)))
              [ $((m % 10)) -eq 3 ] && lanzar demo-cripto.yml
              [ $((m % 20)) -eq 5 ] && lanzar aprendiz.yml
              [ "$m" -eq 7 ] && lanzar escuela.yml
              [ "$h" -eq 0 ] && [ "$m" -eq 0 ] && lanzar pronostico.yml
              [ "$h" -eq 21 ] && [ "$m" -eq 45 ] && lanzar pronostico.yml
              [ "$h" -eq 22 ] && [ "$m" -eq 30 ] && { lanzar universo.yml; lanzar vita-diario.yml; }
              [ "$h" -eq 2 ] && [ "$m" -eq 20 ] && lanzar archivar.yml
              [ "$h" -eq 3 ] && [ "$m" -eq 30 ] && lanzar gimnasio.yml
              [ "$h" -eq 4 ] && [ "$m" -eq 20 ] && lanzar fabrica-diaria.yml
              [ "$h" -eq 5 ] && [ "$m" -eq 10 ] && lanzar fabrica.yml
              [ "$dow" -eq 7 ] && [ "$h" -eq 3 ] && [ "$m" -eq 35 ] && lanzar enciclopedia.yml
              [ "$dom" -eq 1 ] && [ "$h" -eq 23 ] && [ "$m" -eq 0 ] && lanzar carteras-robots.yml
            fi
            sleep 20
          done
          echo "Relevo: despachando el siguiente vigilante"
          for i in 1 2 3; do lanzar vigilante.yml && break; sleep 30; done
