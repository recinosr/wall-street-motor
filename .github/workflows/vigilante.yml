name: vigilante
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 */3 * * *'
permissions:
  actions: write
  contents: write
concurrency:
  group: vigilante
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_vigilante.py
      - name: Despachar, publicar latido y solicitar relevo
        run: python -m scripts.vigilante
