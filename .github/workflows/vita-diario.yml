name: Diario determinista de Vita
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: motor-main
  queue: max
  cancel-in-progress: false
jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_vita_diario.py
      - run: python -m lab.vita_diario
      - run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/vita_diario.json resultados/vita_diario/ resultados/indice_activos.json
          git diff --cached --quiet && exit 0
          git commit -m "diario Vita $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin main
