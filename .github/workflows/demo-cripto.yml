name: Demo cripto 24 horas ficticia
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: motor-demo
  queue: max
  cancel-in-progress: false
jobs:
  observar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_demo_cripto.py
      - name: Observar datos públicos; publicar intención antes de futura ejecución
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m lab.demo_cripto
      - name: Conservar cuentas e historial permanente
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/demo_cripto.json resultados/demo_cripto_ledger/
          git diff --cached --quiet && exit 0
          git commit -m "demo cripto $GITHUB_RUN_ID"
          bash scripts/push_results.sh
