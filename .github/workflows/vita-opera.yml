name: Vita opera en papel
on:
  workflow_call:
    inputs:
      tipo:
        type: string
        default: cripto
  workflow_dispatch:
    inputs:
      tipo:
        type: choice
        options: [cripto, bolsa]
        default: cripto
permissions:
  contents: write
  actions: read
concurrency:
  group: motor-vita-opera
  queue: max
  cancel-in-progress: false
jobs:
  observar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_vita_opera.py
      - run: python -m lab.vita_opera --tipo ${{ inputs.tipo }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/vita_opera.json resultados/vita_opera_ledger/
          git diff --cached --quiet && exit 0
          git commit -m "Vita papel $GITHUB_RUN_ID"
          bash scripts/push_results.sh
