name: Pronóstico prospectivo y marcador
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '15 12 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [completo, calificar]
        default: completo
        description: Registrar y calificar o solo cierres maduros
permissions:
  contents: write
  actions: read
concurrency:
  group: pronostico-calculo
  queue: max
  cancel-in-progress: false
jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_pronostico.py
      - name: Calificar solo pronósticos publicados y con recibo exitoso
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m lab.pronostico calificar
      - name: Registrar antes del cierre objetivo; cripto solo ventana UTC00
        if: inputs.modo != 'calificar'
        env:
          API_1: ${{ secrets.API_1 }}
        run: |
          python -m lab.pronostico registrar --tipo cripto
          python -m lab.pronostico registrar --tipo acción
      - name: Refrescar contador después del registro; no calificar el resultado futuro
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m lab.pronostico calificar
      - uses: actions/upload-artifact@v4
        with:
          name: pronosticos-metricas
          path: |
            resultados/pronosticos/
            resultados/calificaciones/
            resultados/marcador.json
  publicar:
    needs: registrar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: motor-main
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pronosticos-metricas
          path: resultados/
      - name: Publicar cadena verificable sin reescribir pasado
        run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          mkdir -p resultados/pronosticos resultados/calificaciones
          git add resultados/pronosticos/ resultados/calificaciones/ resultados/marcador.json
          git diff --cached --quiet && exit 0
          git commit -m "pronósticos y marcador $GITHUB_RUN_ID"
          bash scripts/push_results.sh
          day=$(date -u +%F)
          tag="oraculo-$day"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            hashes=$(find resultados/pronosticos -maxdepth 1 -name "$day-*.json" -print0 | sort -z | xargs -0 -r sha256sum)
            git tag -a "$tag" -m "Ancla diaria de predicciones SHA-256: $hashes"
            git push origin "refs/tags/$tag"
          fi
