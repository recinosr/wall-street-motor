name: Robots sistemáticos y futuros gestionados
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: motor-main
  queue: max
  cancel-in-progress: false
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pandas numpy requests yfinance exchange_calendars
      - run: python -m unittest discover -s tests -p 'test_carteras*.py'
      - run: python -m lab.carteras --robots --salida resultados/carteras_robots.json
      - run: |
          git config user.name motor-bot
          git config user.email motor-bot@users.noreply.github.com
          git add resultados/carteras_robots.json
          git diff --cached --quiet && exit 0
          git commit -m "robots sistemáticos $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin main
